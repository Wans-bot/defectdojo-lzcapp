version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/defectdojo.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
  - id: django-uwsgi
    target: service
    service: uwsgi
    source: docker.io/defectdojo/defectdojo-django
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat
  - id: django-celerybeat
    target: service
    service: celerybeat
    source: docker.io/defectdojo/defectdojo-django
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat
  - id: django-celeryworker
    target: service
    service: celeryworker
    source: docker.io/defectdojo/defectdojo-django
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: nginx
    source: docker.io/defectdojo/defectdojo-nginx
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh
      - en
  private:
    enabled: false
